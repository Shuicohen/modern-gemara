<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModernGemara</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #f8f6f2; color: #1a1a1a; line-height: 1.5; }
header { text-align: center; margin-bottom: 1.5rem; }
header h1 { margin: 0 0 0.3rem; color: #1e3a5f; }
.card { background: white; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.samples { display: flex; flex-wrap: wrap; gap: 0.5rem; }
button { background: #1e3a5f; color: white; border: none; padding: 0.55rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
button:hover { opacity: 0.9; }
.output { background: #f0ebe3; padding: 1.2rem; border-radius: 8px; margin-top: 1rem; }
.output strong { color: #1e3a5f; }
.principle { margin-top: 1rem; padding: 0.8rem; background: #fffbeb; border-left: 3px solid #c9a227; border-radius: 0 6px 6px 0; }
</style>
</head>
<body>
<header>
  <h1>ModernGemara</h1>
  <p>Understand Torah & Gemara examples with modern situations</p>
</header>

<div class="card">
  <div class="samples">
    <button onclick="show('ox')">Ox that gores</button>
    <button onclick="show('garment')">Two people holding a garment</button>
    <button onclick="show('pit')">Open pit</button>
    <button onclick="show('fire')">Fire that spreads</button>
    <button onclick="show('muad')">Habitual gorer (muad)</button>
    <button onclick="show('lost')">Lost animal</button>
    <button onclick="show('tooth')">Animal eating crops</button>
    <button onclick="show('foot')">Animal trampling</button>
  </div>
  <div id="out" class="output" style="display:none"></div>
</div>

<script>
const samples = {
  ox: {
    o: "If one man's ox gores another man's ox and it dies, they sell the live ox and divide the money, and the dead ox they also divide.",
    m: "If one person's car rear-ends another person's car and totals it, and the first driver has no prior accidents on record, they sell the remaining value of the undamaged car and split the proceeds, and they also split the value of the totaled car.",
    p: "Limited liability when the damaging thing (ox/car) was not previously known to be dangerous. Damages are shared rather than fully assigned."
  },
  garment: {
    o: "Two people are holding a garment. One says 'I found it,' and the other says 'I found it.' One says 'It's all mine,' and the other says 'It's all mine.' They divide it.",
    m: "Two people are holding the same phone. One says 'I found it,' and the other says 'I found it.' One says 'It's all mine,' and the other says 'It's all mine.' They divide its value.",
    p: "When both parties have an equal claim and neither can prove superior ownership, the disputed item is split."
  },
  pit: {
    o: "If a man opens a pit, or digs a pit and does not cover it, and an ox or a donkey falls into it, the owner of the pit shall pay; he shall give money to the owner, and the dead animal shall be his.",
    m: "If a person opens a trench in a sidewalk or digs a hole and does not cover or mark it, and a car or scooter falls into it and is damaged, the person who dug the trench shall pay; he shall give money to the owner, and the damaged vehicle becomes his.",
    p: "Creating a hazard on shared or public ground makes you fully liable for the damage it causes."
  },
  fire: {
    o: "If a fire breaks out and spreads to thorns so that stacked grain or standing grain or the field is consumed, the one who started the fire shall make full restitution.",
    m: "If a person starts a fire that spreads to a neighbor's property and burns stored goods, standing crops, or the field itself, the person who started the fire shall make full restitution.",
    p: "The person who starts a fire is fully responsible for the damage it causes when it spreads beyond their control."
  },
  muad: {
    o: "If the ox was known to be a habitual gorer (muad) and its owner was warned but did not guard it, and it kills another ox, the owner must pay full damages (ox for ox) and keeps the dead animal.",
    m: "If the car was known to have a history of accidents or the driver had repeated reckless driving tickets and was warned, and it totals another car, the owner must pay full damages and keeps the wrecked car.",
    p: "Full liability applies when the danger was known in advance and the owner failed to take proper precautions."
  },
  lost: {
    o: "If you see your brother's ox or sheep going astray, you shall not ignore them; you shall bring them back to your brother.",
    m: "If you see your neighbor's bike or phone left unattended in a public place, you shall not ignore it; you shall return it to its owner.",
    p: "There is a positive obligation to return lost property rather than walk past it."
  },
  tooth: {
    o: "If an animal eats another person's crops in the field (damage by tooth), the owner is fully liable.",
    m: "If a person's dog gets into a neighbor's garden and eats or destroys the plants, the dog's owner is fully liable.",
    p: "Damage caused by an animal's natural behavior of eating is the owner's full responsibility."
  },
  foot: {
    o: "If an animal tramples another person's crops or property (damage by foot), the owner is fully liable.",
    m: "If a person's dog or child runs through a neighbor's garden and tramples the plants, the owner is fully liable.",
    p: "Damage caused by an animal's normal movement is the owner's full responsibility."
  }
};

function show(k) {
  const s = samples[k];
  const out = document.getElementById('out');
  out.style.display = 'block';
  out.innerHTML = '<strong>Original</strong><br>' + s.o +
                  '<br><br><strong>Modernized</strong><br>' + s.m +
                  '<div class="principle"><strong>Principle kept:</strong> ' + s.p + '</div>';
  out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
